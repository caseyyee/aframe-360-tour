<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>360&deg; Tour</title>
    <meta name="description" content="360&deg; Tour - A-Frame">
    <script src="https://aframe.io/releases/0.5.0/aframe.min.js"></script>
    <script src="primitives/tour.js"></script>
    <script src="primitives/hotspot.js"></script>
    <script src="primitives/panorama.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-mixin id="hotspot-text" text="font: exo2bold; width: 5" geometry="primitive: plane; width: 1.6; height: 0.4" material="color: black;" position="0 -0.6 0"></a-mixin>
        <a-mixin id="hotspot-target" geometry="primitive: octahedron; radius: 0.3;" material="flatShading: true; color: rgb(255, 0, 161)"></a-mixin>
      </a-assets>

      <a-tour hotspot-helper="target: #test">
        <a-panorama id="room1" src="images/room1.jpeg" rotation="0 0 0"></a-panorama>
        <a-panorama id="room2" src="images/room2.jpeg" rotation="0 0 0"></a-panorama>
        <a-panorama id="room3" src="images/room3.jpeg" rotation="0 0 0"></a-panorama>

        <!-- Helper hotspot: isse ghuma ke sahi jagah dhundho, phir hata dena -->
        <a-hotspot id="test" for="room1" to="room2" mixin="hotspot-target" position="5 0 0" rotation="0 -90 0">
          <a-text value="Test" align="center" mixin="hotspot-text"></a-text>
        </a-hotspot>

        <!-- Room 1 -->
        <a-hotspot for="room1" to="room2" mixin="hotspot-target" position="5 0 0" rotation="0 -90 0">
          <a-text value="ROOM 2" align="center" mixin="hotspot-text"></a-text>
        </a-hotspot>
        <a-hotspot for="room1" to="room3" mixin="hotspot-target" position="-5 0 0" rotation="0 90 0">
          <a-text value="ROOM 3" align="center" mixin="hotspot-text"></a-text>
        </a-hotspot>

        <!-- Room 2 -->
        <a-hotspot for="room2" to="room3" mixin="hotspot-target" position="0 0 -5" rotation="0 0 0">
          <a-text value="ROOM 3" align="center" mixin="hotspot-text"></a-text>
        </a-hotspot>
        <a-hotspot for="room2" to="room1" mixin="hotspot-target" position="0 0 5" rotation="0 180 0">
          <a-text value="ROOM 1" align="center" mixin="hotspot-text"></a-text>
        </a-hotspot>

        <!-- Room 3 -->
        <a-hotspot for="room3" to="room1" mixin="hotspot-target" position="5 0 0" rotation="0 -90 0">
          <a-text value="ROOM 1" align="center" mixin="hotspot-text"></a-text>
        </a-hotspot>
        <a-hotspot for="room3" to="room2" mixin="hotspot-target" position="0 0 5" rotation="0 180 0">
          <a-text value="ROOM 2" align="center" mixin="hotspot-text"></a-text>
        </a-hotspot>
      </a-tour>

      <a-entity camera look-controls wasd-controls>
        <a-entity cursor position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
          material="color: black; shader: flat">
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
